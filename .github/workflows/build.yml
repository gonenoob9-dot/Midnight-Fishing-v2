name: Build Windows EXE
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip game
        shell: pwsh
        run: Expand-Archive -Path game.zip -DestinationPath app -Force
      - name: Install
        working-directory: app
        run: npm install
      - name: Build
        working-directory: app
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Midnight-Fishing-Windows
          path: app/dist/*.exe
